# Catppuccin Mocha palette
palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"

[character]
success_symbol = "[❯](peach)"
error_symbol = "[❯](red)"
vicmd_symbol = "[❮](green)"

[directory]
style = "blue"
format = "[ $path ]($style)"
truncation_length = 3

[git_branch]
format = "[$symbol$branch]($style) "
style = "teal"

[git_status]
conflicted = "🏳"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = "✓"
untracked = "…"
stashed = "⚑"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
style = "yellow"
format = "([\\[$all_status\\]$ahead_behind ]($style))"

[nodejs]
format = "via [$symbol($version)]($style) "
style = "green"

[python]
format = "via [$symbol($version)]($style) "
style = "yellow"

[ruby]
format = "via [$symbol($version)]($style) "
style = "red"

[rust]
format = "via [$symbol($version)]($style) "
style = "peach"

[bun]
format = "via [$symbol($version)]($style) "
style = "pink"

[cmd_duration]
format = "[⏱ $duration]($style)"
style = "overlay0"

[line_break]
disabled = false

[fill]
style = "surface0"

[nix_shell]
format = "via [$symbol($state)]($style) "
style = "sapphire"

[time]
disabled = true
format = "[ $time ]($style)"
style = "overlay0"
time_format = "%H:%M"

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "overlay0"

[username]
show_always = false
format = "[$user]($style) "
style = "overlay0"
